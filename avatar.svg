<svg viewBox="0 0 256 256" width="256" height="256" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tutti: a conductor's cue out to every device on the network, and the responses arrive in turn.">
  <g font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <text x="128" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#4a6741">tutti</text>
  <text x="128" y="76" text-anchor="middle" font-size="10" fill="#707070">audio renderer probe</text>

  <!-- conductor at centre -->
  <circle cx="128" cy="170" r="14" fill="none" stroke="#4a6741" stroke-width="2"/>
  <circle cx="128" cy="170" r="4" fill="#4a6741"/>

  <!-- five devices fanned overhead -->
  <circle cx="56"  cy="120" r="9" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="92"  cy="100" r="9" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="128" cy="92"  r="9" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="164" cy="100" r="9" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="200" cy="120" r="9" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- fan: call out (moss). conductor (128, 170) r=14, renderer r=9. lines start at the conductor edge, end at each renderer edge. -->
  <line x1="116.5" y1="162.0" x2="63.4"  y2="125.1" stroke="#4a6741" stroke-width="1.25"/>
  <line x1="121.6" y1="157.6" x2="96.1"  y2="108.0" stroke="#4a6741" stroke-width="1.25"/>
  <line x1="128"   y1="156"   x2="128"   y2="101"   stroke="#4a6741" stroke-width="1.25"/>
  <line x1="134.4" y1="157.6" x2="159.9" y2="108.0" stroke="#4a6741" stroke-width="1.25"/>
  <line x1="139.5" y1="162.0" x2="192.6" y2="125.1" stroke="#4a6741" stroke-width="1.25"/>

  <!-- floor line -->
  <line x1="40" y1="204" x2="216" y2="204" stroke="#e0e0e0" stroke-width="1"/>
  <text x="128" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="#0a0a0a">tutti calls; everyone responds</text>
  <text x="128" y="236" text-anchor="middle" font-size="8" fill="#707070">a paste-ready bundle drops out</text>
  </g>
</svg>
