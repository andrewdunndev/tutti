<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tutti: a conductor calls out to renderers and the responses fan back.">
  <!-- call lines fan from conductor to each renderer -->
  <line x1="32" y1="44" x2="13" y2="33" stroke="#4a6741" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="21" y2="25" stroke="#4a6741" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="22" stroke="#4a6741" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="43" y2="25" stroke="#4a6741" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="51" y2="33" stroke="#4a6741" stroke-width="1.25" stroke-linecap="round"/>
  <!-- conductor (center, filled) -->
  <circle cx="32" cy="44" r="3" fill="#4a6741"/>
  <!-- five renderers (filled dots at line ends) -->
  <circle cx="13" cy="33" r="2" fill="#4a6741"/>
  <circle cx="21" cy="25" r="2" fill="#4a6741"/>
  <circle cx="32" cy="22" r="2" fill="#4a6741"/>
  <circle cx="43" cy="25" r="2" fill="#4a6741"/>
  <circle cx="51" cy="33" r="2" fill="#4a6741"/>
</svg>
