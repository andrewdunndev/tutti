<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tutti: a conductor calls out to renderers and the responses fan back.">
  <!-- call lines fan from conductor to each renderer -->
  <line x1="32" y1="44" x2="12" y2="32" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="20" y2="24" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="20" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="44" y2="24" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="52" y2="32" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <!-- conductor (center, filled) -->
  <circle cx="32" cy="44" r="4" fill="#4a6741"/>
  <!-- five renderers (filled dots at line ends) -->
  <circle cx="12" cy="32" r="2" fill="#4a6741"/>
  <circle cx="20" cy="24" r="2" fill="#4a6741"/>
  <circle cx="32" cy="20" r="2" fill="#4a6741"/>
  <circle cx="44" cy="24" r="2" fill="#4a6741"/>
  <circle cx="52" cy="32" r="2" fill="#4a6741"/>
</svg>
