<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tutti: a conductor calls out to renderers and the responses fan back.">
  <!-- conductor (center) -->
  <circle cx="32" cy="44" r="6" fill="none" stroke="#4a6741" stroke-width="2.5"/>
  <circle cx="32" cy="44" r="2" fill="#4a6741"/>
  <!-- five renderers in an arc above -->
  <circle cx="13" cy="33" r="3" fill="none" stroke="#4a6741" stroke-width="1.5"/>
  <circle cx="21" cy="25" r="3" fill="none" stroke="#4a6741" stroke-width="1.5"/>
  <circle cx="32" cy="22" r="3" fill="none" stroke="#4a6741" stroke-width="1.5"/>
  <circle cx="43" cy="25" r="3" fill="none" stroke="#4a6741" stroke-width="1.5"/>
  <circle cx="51" cy="33" r="3" fill="none" stroke="#4a6741" stroke-width="1.5"/>
  <!-- call lines: conductor edge → renderer edge -->
  <line x1="26.8" y1="41" x2="15.2" y2="34.3" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="38.8" x2="22.25" y2="27.2" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="24.5" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="38.8" x2="41.75" y2="27.2" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37.2" y1="41" x2="48.8" y2="34.3" stroke="#4a6741" stroke-width="1.5" stroke-linecap="round"/>
</svg>
